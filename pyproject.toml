[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiaeye"
version = "0.1.0"
description = "GaiaEye: AI-Powered Environmental Awareness System"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "opencv-python-headless>=4.10.0",
    "ultralytics>=8.3.0",
    "tensorflow>=2.16.0",
    "tensorflow_hub>=0.15.0",
    "scipy>=1.11.0",
    "librosa>=0.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "black==24.4.2",
    "flake8==7.1.1",
    "mypy==1.11.1",
]

[project.scripts]
gaiaeye = "main:main"
